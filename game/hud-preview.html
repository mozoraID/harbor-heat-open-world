<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Heat HUD Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  #bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 600px at 70% 20%, rgba(92,200,255,0.25), transparent 60%),
      radial-gradient(900px 500px at 20% 80%, rgba(255,107,90,0.18), transparent 60%),
      linear-gradient(160deg, #162033 0%, #1d2a3a 40%, #2a3a2f 70%, #3a2f1f 100%);
  }
  #bg::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 80px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 80px);
    opacity: 0.4;
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="hud"></div>
<script type="module">
import { createHudSystem } from './src/ui/hud/hudRoot.js';

const hud = createHudSystem(document.getElementById('hud'));

// Simple city-like map data in world metres around player (0,0)
const roads = [];
const blocks = [];
for (let gx = -6; gx <= 6; gx++) {
  for (let gz = -6; gz <= 6; gz++) {
    const x = gx * 60, z = gz * 60;
    blocks.push({ x, z, w: 44, h: 44 });
    roads.push({ x: x + 30, z, w: 16, h: 60 });
    roads.push({ x, z: z + 30, w: 60, h: 16 });
  }
}
const water = [{ x: 0, z: 260, w: 800, h: 220 }];
hud.setMapData({ roads, blocks, water });

const state = {
  player: { x: 12, z: -8, yaw: 0.6, money: 18450, wanted: 4, health: 72, armour: 40, inCar: true, activeWeapon: 4 },
  car: { name: 'Solenne Vortex GT', speed: 30.83, condition: 86, gear: '4', yaw: 0.6 }, // ~111 km/h
  districtName: 'Marigold Beach',
  timeOfDay: '18:42',
  wanted: { searching: true, status: 'AIR UNIT OVERHEAD' },
  mission: {
    number: 6, act: 'ACT I', title: 'Neon Tides', stage: 3, stageTotal: 4,
    objective: 'Lose the heat and reach the safehouse in Coral Quay',
    highlight: 'safehouse',
    next: 'MEET SASHA AT THE DOCKS',
    timer: 95,
  },
  dispatch: {
    stars: 4,
    units: [
      { icon: '🚓', callSign: 'GULL-11', distance: 42, tag: 'RAMMING' },
      { icon: '🚓', callSign: 'MARLIN-2', distance: 78, tag: 'PIT' },
      { icon: '🚔', callSign: 'BULWARK-1', distance: 120, tag: 'FLANKING' },
      { icon: '🚁', callSign: 'HERON-1', distance: 210, tag: 'SPOTLIGHT' },
      { icon: '🚓', callSign: 'GULL-14', distance: 260, tag: 'ROADBLOCK' },
      { icon: '🚓', callSign: 'MARLIN-5', distance: 310, tag: 'PURSUIT' },
    ],
    more: 2,
  },
  weapons: [
    { slot: 1, id: 'fists', name: 'Fists', ammo: null, owned: true },
    { slot: 2, id: 'bat', name: 'Bat', ammo: null, owned: true },
    { slot: 3, id: 'pistol', name: 'Kestrel 9', ammo: [12, 60], owned: true },
    { slot: 4, id: 'smg', name: 'Viper', ammo: [30, 120], owned: true },
    { slot: 5, id: 'shotgun', name: 'Breaker', ammo: [8, 32], owned: false, locked: true },
    { slot: 6, id: 'rifle', name: 'Tern AR', ammo: [30, 90], owned: false, locked: true },
  ],
  rank: { name: 'Wheelman', xp: 340, next: 600 },
  minimap: {
    target: { x: 140, z: -120 },
    shops: [ { x: -60, z: 40, letter: 'A' }, { x: 90, z: 80, letter: 'G' }, { x: -120, z: -60, letter: 'C' } ],
    police: [
      { x: 40, z: 30, yaw: 2.4 },
      { x: -30, z: -70, yaw: 0.8 },
      { x: 80, z: -10, yaw: 3.6 },
      { x: -10, z: 90, yaw: 1.2 },
    ],
  },
  radio: { station: 'WAVE 101.7', genre: 'Coastline Pop', track: 'Neon Shoreline' },
  dialogue: {
    speaker: 'Sasha Lune',
    role: 'Getaway Artist',
    text: "Keep it tight through the marina—GULL units love to ram on the straight. I'll pop the safehouse gate when you're clear.",
  },
  notifications: [
    { text: '+S$ 1,200', tone: 'mint' },
    { text: 'NEW CAR STOLEN', tone: 'gold' },
    { text: 'WANTED LEVEL UP', tone: 'coral' },
  ],
  crosshair: true,
  interact: { key: 'F', action: 'Steal car' },
};

function loop() {
  hud.update(state);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
