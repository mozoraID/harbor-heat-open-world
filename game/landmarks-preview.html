<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landmarks Preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #87b8d8; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { createLayout } from './src/world/layout.js';
    import { addLandmarks } from './src/landmarks/index.js';
    import { COLORS } from './src/core/constants.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x87ceeb, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0xcfe8f5, 300, 1400);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2500);

    const hemi = new THREE.HemisphereLight(0xfff4dc, 0x556b4f, 1.0);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(180, 260, 120);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xbfdfff, 0.35);
    fill.position.set(-200, 120, -100);
    scene.add(fill);

    // Ground: city base, sand beach band, ocean
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(2600, 2600), new THREE.MeshLambertMaterial({ color: 0x7f9468 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    scene.add(ground);

    const sand = new THREE.Mesh(new THREE.PlaneGeometry(2600, 240), new THREE.MeshLambertMaterial({ color: COLORS.sand || 0xf2d3a3 }));
    sand.rotation.x = -Math.PI / 2;
    sand.position.set(0, 0.01, 360);
    scene.add(sand);

    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(3000, 900), new THREE.MeshLambertMaterial({ color: COLORS.ocean || 0x2f88a8 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.set(0, 0.0, 760);
    scene.add(ocean);

    const layout = createLayout(() => 0.5);

    // Simple road grid hint
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x3b4048 });
    const vRoad = new THREE.BoxGeometry(layout.roadWidth, 0.06, layout.depth);
    for (let i = 0; i <= layout.n; i++) {
      const x = layout.offsetX + i * layout.cell + layout.roadWidth / 2;
      const m = new THREE.Mesh(vRoad, roadMat);
      m.position.set(x, 0.03, 0);
      scene.add(m);
    }
    const hRoad = new THREE.BoxGeometry(layout.width, 0.06, layout.roadWidth);
    for (let j = 0; j <= layout.n; j++) {
      const z = layout.offsetZ + j * layout.cell + layout.roadWidth / 2;
      const m = new THREE.Mesh(hRoad, roadMat);
      m.position.set(0, 0.03, z);
      scene.add(m);
    }

    const rng = () => Math.random();
    let landmarks = null;
    try {
      landmarks = addLandmarks(scene, layout, rng);
    } catch (e) {
      console.error('landmarks error', e);
    }

    // Fixed orbit-ish camera (starts angled toward pier/beach/bridge area)
    function updateCamera(now) {
      const a = 0.8 + now * 0.00012; // start at a nice angle
      const radius = 560;
      const cx = -20, cz = 120;
      camera.position.set(cx + Math.cos(a) * radius, 210 + Math.sin(a * 0.6) * 25, cz + Math.sin(a) * radius);
      camera.lookAt(-20, 15, 140);
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (landmarks && landmarks.update) landmarks.update(dt);
      updateCamera(now);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
